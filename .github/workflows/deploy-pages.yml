name: Deploy to GitHub Pages

# Builds the Vite frontend and publishes it to GitHub Pages.
# Requires (repo Settings):
#   - Pages source set to "GitHub Actions"
#   - Variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY for the shared
#     database (Settings → Secrets and variables → Actions → Variables).
#     Without them the site falls back to per-device local storage.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GHPAGES: "true"
          # Supabase connection (repo Settings → Secrets and variables → Actions
          # → Variables). Without them the site falls back to local IndexedDB.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # SPA fallback: serve the app for deep links / refreshes on client routes.
      - run: cp dist/index.html dist/404.html
      # enablement:true turns Pages on automatically (Source = GitHub Actions),
      # so no manual toggle is needed — as long as Pages is available for the
      # repo (public repo on the free plan, or any repo on a paid plan).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
